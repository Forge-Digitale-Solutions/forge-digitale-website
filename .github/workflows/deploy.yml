name: Site GHCR

# Prod image: build on GitHub, push to GHCR, then Dokploy pulls.
# Trigger only when main moves (merge dev → main). Not on dev / feat/*.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/forge-digitale-solutions/forge-digitale-website

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          sha="${GITHUB_SHA::7}"
          echo "tags=${IMAGE}:latest,${IMAGE}:${sha}" >> "$GITHUB_OUTPUT"
          echo "package_url=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY=${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          PACKAGE_URL: ${{ steps.meta.outputs.package_url }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "::warning::DOKPLOY_DEPLOY_WEBHOOK secret is missing; image was pushed but Dokploy was not notified."
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -H "x-github-event: registry_package" \
            -d "{\"registry_package\":{\"package_version\":{\"package_url\":\"${PACKAGE_URL}\"}}}"
