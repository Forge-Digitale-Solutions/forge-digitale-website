name: Mise en ligne OVH

# Prod is the Dokploy Application (Docker build, branch main, `next start` on
# port 3000) after DNS cutover. This workflow must not FTP on every push to
# main, or it would overwrite the VPS with a stale static tree.
#
# `output: "export"` was removed, so `./out/` is no longer produced. Do not
# turn the FTP job back on.
#
# GitHub secrets are intentionally left in place for the cutover:
# - NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY — set this as a Docker build ARG in Dokploy
#   (Next inlines it at build time; a runtime env var is not enough).
# - FTP_SERVER, FTP_USERNAME, FTP_PASSWORD — still needed only if OVH must be
#   touched by hand before DNS moves. Remove them once OVH is switched off.
#
# workflow_dispatch is a no-op so the file stays visible without deploying.

on:
  workflow_dispatch:

jobs:
  web-deploy:
    name: FTP OVH désactivé
    runs-on: ubuntu-latest
    steps:
      - name: Rappel — Dokploy sert la prod
        run: |
          echo "FTP OVH is disabled. Production is the Dokploy container (next start, port 3000, healthcheck curl http://127.0.0.1:3000/)."
          echo "Secrets kept in the repo: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY."
