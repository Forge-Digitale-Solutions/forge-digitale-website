name: Deploy Dokploy

# Remplace le déploiement FTP OVH mutualisé.
# Prérequis secrets GitHub :
#   DOKPLOY_WEBHOOK_URL — URL webhook de l'application (Dokploy → Deployments → Webhook)
#
# Dokploy build lui-même le Dockerfile (Git provider + auto-deploy).
# Ce workflow ne fait que déclencher un redeploy après push sur main.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger:
    name: Trigger Dokploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify Dokploy webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL manquant — configure le secret ou active l'auto-deploy Git dans Dokploy."
            exit 1
          fi
          curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL"
          echo "Dokploy webhook OK"
