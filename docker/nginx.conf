server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTTPS / www → apex : gérés par Traefik (Dokploy).

    # Anciennes routes → home
    location = /services { return 301 /; }
    location = /services/ { return 301 /; }
    location = /about { return 301 /; }
    location = /about/ { return 301 /; }
    location = /contact { return 301 /; }
    location = /contact/ { return 301 /; }
    location = /realisations { return 301 /; }
    location = /realisations/ { return 301 /; }
    location = /faq { return 301 /; }
    location = /faq/ { return 301 /; }

    # Assets Next hashés
    location /_next/static/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|webp|jpe?g|png|svg|ico|woff2)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /blog/x.html → /blog/x/ (sauf pages d'erreur internes)
    location ~ ^/(?!404\.html$)(.+)\.html$ {
        return 301 /$1/;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
